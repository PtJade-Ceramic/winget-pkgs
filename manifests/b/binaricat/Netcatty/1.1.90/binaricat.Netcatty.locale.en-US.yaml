ReleaseNotes: |-
  ✨ Release Highlights
  Netcatty v1.1.90 fixes MCP readiness when the shell shows a Python/conda-style (env) prefix, and stops keyword highlighting from overpainting Starship/truecolor text. Also includes an SFMono Nerd Font picker allowlist fix.
  🤖 External MCP
  - Idle SSH Bash prompts that start with a Python virtualenv, conda, or BT-panel name such as (3.12.12) or (venv) are recognized again, so MCP / AI terminal_execute no longer hangs with SHELL_NOT_READY (#3948 / #3947).
  🖥️ Terminal
  - Keyword highlight rules no longer recolor cells that already have an ANSI foreground (for example Starship truecolor path segments). Shell colors win over default keyword rules (#3941 / #3940).
  - SF Mono Nerd Font appears in the terminal font picker allowlist so it can be selected like other bundled fonts (#3930 / #3929).
  Code signing policy
  Netcatty is applying to the SignPath Foundation open-source program. Once
  approved, covered Windows release artifacts will use Free code signing provided by SignPath.io, certificate by SignPath Foundation.
  See the
  Code signing policy
  and Privacy policy.
  What's Changed
  - fix(fonts): include SFMono Nerd Font in the terminal font picker by @binaricat in https://github.com/binaricat/Netcatty/pull/3930
  - chore: update star history charts by @github-actions[bot] in https://github.com/binaricat/Netcatty/pull/3932
  - Update Nix release metadata for v1.1.89 by @netcatty-bot in https://github.com/binaricat/Netcatty/pull/3931
  - fix(terminal): skip keyword highlight on ANSI-colored cells by @binaricat in https://github.com/binaricat/Netcatty/pull/3941
  - fix(mcp): recognize Python env-prefixed idle POSIX prompts by @binaricat in https://github.com/binaricat/Netcatty/pull/3948
  Full Changelog: https://github.com/binaricat/Netcatty/compare/v1.1.89...v1.1.90
