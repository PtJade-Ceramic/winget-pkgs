ReleaseNotes: |-
  AtomCode v5.2.7 Release Notes
  发布日期：2026-11-12
  v5.2.7 聚焦长任务稳定性与日常操作效率：MCP 支持会话级一键暂停与恢复，长会话历史改为按需分页加载，上下文压缩与中断恢复更可靠；同时新增隔离浏览器自动化、会话分叉、质量门禁与 DAP 调试能力，并系统性改善 WebUI 工作区体验和工具错误反馈。

  ⚠️ Behavior Changes（注意行为变化）
  - 中断不再丢弃待办：Esc 与 Ctrl+C 现在只停止本轮执行，Todo 列表会保留；此前中断会连带丢失待办进度。
  - 编辑校验改为提醒 + 可选门禁：自动语法校验不再隐式执行，改为提醒模型检查未验证的改动；需要强制检查时通过 /quality 显式开启。
  - 内置 /computer 桌面集成下线：内置桌面操作入口已移除，浏览器自动化改由 /browser 配置外部隔离浏览器后端提供。

  ✨ 新增功能（Features）
  浏览器自动化（browser-use）
  - 配置一次即可自动使用：通过 /browser enable 指向已安装的浏览器后端后，直接描述打开网页、填写表单、点击或截图等任务，即可自动加载浏览器指引并调用已连接的 MCP 工具，无需每次输入 $browser-use 或斜杠命令
  - 隔离会话与原生审批：使用独立浏览器配置目录运行，调用沿用现有 MCP 审批通道；/browser status|doctor|enable|disable|reload|help 提供状态查看、环境自检与配置重载
  - 来源作用域治理：可托管来源策略，按源站限制浏览与子资源访问，并对重定向、iframe 与子资源做实际校验，而非依赖后端的便捷参数
  - 受控下载与上传：支持显式发起的受控下载与分片上传，下载产物由后端持有并可在当前回合取消；跨端分区 Cookie 的读取与写入按来源校验
  - 活动分组展示：TUI 中将浏览器操作与普通工具调用分开归组，保留失败计数与可展开详情
  MCP
  - 一键暂停与恢复：/mcp 列表顶部 Ctrl+S 暂停或恢复全部 MCP，仅作用于当前会话，不改写各服务器的启用配置；WebUI 同样提供入口
  - 必需能力校验：连接时强制校验声明的实验性能力，缺失即明确报错，不再降级静默运行
  - 精确工具白名单：工具发现与执行两侧统一按声明白名单过滤，避免未授权工具被调用
  - 更相关的工具搜索：mcp_search 忽略停用词与过短词的描述命中，并返回 best_score，垃圾查询不再匹配一大片工具
  会话管理
  - 会话分叉 /fork：复制当前对话并切换到独立会话，分叉会带走待办侧车与来源信息；WebUI 提供对应入口
  - 待办跨操作同步：待办记录在撤销、回退、取消和分叉后保持一致，不再出现"模型说做完了、待办还挂着一堆"的状态错位
  - 中断后可靠续跑：异常中断后恢复已接受的提示词，恢复回放具备可重试语义，尾部残留写入会在下一次追加前被裁掉
  长会话与上下文压缩
  - 历史按需分页：TUI 与 WebUI 都改为按需加载显示历史，长会话打开与回滚浏览不再一次性拉全量；WebUI 自动历史页会合并展示
  - 压缩输入有界：压缩摘要输入按预算裁剪，旧工具记录按 stub 预算收敛，嵌套转义、超长参数与多字节内容不再无界增长
  - 失败与无需压缩可区分：摘要失败与"无需压缩"分别呈现，不再被误读为同一种状态
  质量与审查
  - 质量门禁 /quality：on|off|status|evidence|waive <原因> 在普通改动任务交付前执行显式配置的检查项，保留日志与文件指纹；独立于审批模式，失败不回滚文件，可记录人工豁免
  - 自动审查可配置：任务完成前的审查指导可按配置调整，后台审查具备明确的回合预算与失败上报
  - 团队协作可见性：成员写入被拒绝时会向主 agent 报告，且不泄露文件路径与工具参数；主 agent 等待成员工作时不再误显示为已完成
  调试与项目能力
  - DAP 调试：新增 DAP 调试工具与本地适配器发现，默认可用，内置 Python（debugpy）与 LLDB 适配器，并支持在配置中声明自定义适配器
  - 项目能力配置 /setup：检查项目现有能力（如语言与工具链），列出可选工具安装计划并在确认后安装，支持取消与跳过
  - ATI 只读架构证据：可在 /config 中开启的只读架构分析能力，启用后仅挂载 repo_architecture 工具，按调用扫描、不启动后台索引
  - 脏工作区提醒：任务开始前若工作区已有未提交改动，会提示模型避免直接 git checkout / reset
  技能
  - 中文技能名与展示标题：支持中文 name，并可单独设置展示标题，/skills 列表与补全按标题显示
  - 一次引用多个技能：$a $b 一致化支持，并显示各技能的使用历史与已加载状态
  - 保守拼写纠正：技能名拼错时给出低风险纠正建议，而不是静默失败
  WebUI
  - 工作区操作：支持固定、清空和移除工作区，操作前有明确确认
  - 侧栏可拖动调宽：拖动调整侧栏宽度，窄屏下自动折叠；悬浮会话显示完整标题
  - 分支与身份可见：工作目录旁展示当前 Git 分支，会话切换时显示身份卡片
  - 回合过程折叠：已完成的回合过程默认折叠，长会话阅读更清爽
  - 提示历史回溯：输入框内用方向键翻阅历史提示词
  - 新回合定位：新提交的回合锚定在视口顶部，滚动位置跟随
  TUI / 终端
  - 分支展示：工作目录旁显示当前 Git 分支
  - 工具结果图片：工具返回的截图与图片可在隔离预览中查看，不污染对话文本
  - 升级进度：/upgrade 下载显示进度条、速度与预计剩余时间
  - 安全清空输入：输入框非空时，Ctrl+C 优先清空内容而非触发任务控制
  可选集成
  - 华为云沙箱 MCP（默认关闭）：/cloud 或 atomcode cloud enable 本地启用捆绑的华为云集成，凭据不进入对话，云操作保留原生 MCP 审批；doctor 仅检查 Node 与本地注册，不访问云端
  - Grape 云端工作流：对已部署授权服务的环境，可通过 atomcode grape connect --server <https 地址> 连接后使用原生工具检索项目、仓库知识与远程结果；TUI 入口待云端上线后开放

  🛠 修复（Fixes）
  会话与恢复
  - 待办侧车：撤销、回退与分叉后待办不再丢失；重复追加、复用编号和边界动作的合并结果保持正确
  - 恢复回放：死回合已接受的提示词可正确重放，不可读标记不再重放其无法归属的回退
  - 尾部写入：残缺尾行在下次追加前被截断，序列分配不再复用日志中已存在的编号
  - 会话切换：切换失败的反馈交由运行时归属者给出，不再出现"已切换但内容未变"
  - ACP 断连：客户端断开时等待会话清理完成，恢复失败时关闭已恢复的会话；未应答的权限请求在 EOF 时正确收尾
  工具
  - search_replace 捕获组：引用未定义捕获组时直接报错，不再静默清空文件内容；大范围替换先预览并校验预期范围
  - write_file 大文件覆盖：改为流式行计数，不再整文件 read_to_string，修复大文件覆盖时的内存峰值
  - todowrite 越界编号：返回明确错误，不再回显虚假成功
  - ast_grep 解析失败：模式含 ERROR 节点时报解析失败，不再当作无匹配
  - 符号消歧：trace_chain 同名符号不再猜答案，新增 file 参数；trace_callers / trace_callees 补文件消歧与多候选拒绝，未找到时提示索引根
  - apply_patch / import_patch：错误信息带上失败阶段与挂载点提示，对不支持的挂载点给出可行动建议
  - 产物保存回退：output-artifact 保存失败时回退临时目录并说明原因，回退产物可读回
  - web_search：Exa 结果按本地尺寸截断，避免超长响应
  - atomgit：保留 PR 分支参数，接受数字字符串形式的编号
  - open_file（鸿蒙 PC）：直接启动真实 /bin/aa，不再每次先触发一次 ENOEXEC
  - LSP：.cj 文件使用区分大小写的 Cangjie 语言 id，真实服务端可正确返回大纲
  Provider / 网络
  - SSE 流式处理：行缓冲设上限、每块只 drain 一次，修复长响应下的吞吐退化；SSE 片段只扫描一次并忽略终端输入
  - 工具调用编号：流式组装后为缺失的调用补编号，避免后续请求被拒
  - 推理等待与恢复：有界推理等待、按连续截断次数收敛恢复，并提供可选的推理回退与有界重试抖动
  - 辅助模型响应：拒绝不安全的辅助模型输出，评测类错误只保留元数据
  - OpenRouter：编辑后的目录模型恢复排序正确
  缓存与压缩
  - 固定 stub 预算：无窗口时不再溢出，按窗口预算收敛并在标签中说明
  - 引用投影：不再重复序列化事件，减少长会话的额外开销
  - 摘要输入：工具名与参数折叠进调用行，转义角色行与截断标记，避免摘要提示被伪造的对话结构干扰
  WebUI
  - 图片保留：跨客户端切换与实时输出中的工具图片不再丢失
  - 历史加载：历史游标与显示投影对齐，自动分页分组展示，不再断档或重复
  - 会话选择：选择已有会话时保持侧栏顺序，不因排序跳位
  - 侧栏宽度：限制最大宽度，窄屏拖动自动折叠
  - 模态对话框：需要显式关闭，避免误点穿透
  - 工作台刷新：刷新文件列表时不清空当前视图
  终端渲染 / Windows 兼容
  - Alt 释放提交 Unicode：Windows 代码页 936 下粘贴的 emoji 不再被静默丢弃
  - 脚本编码告警：启动前明确提示不安全的脚本编码，而非直接乱码执行
  - 滚动性能：Windows 与鸿蒙的会话滚轮滚动更快
  - 鸿蒙文本浏览器：兼容文本浏览器包装脚本，并隔离滚轮与历史输入
  - 嵌套代码围栏：Markdown 中嵌套的代码围栏正确保留
  - 密码提示：等待密码输入时剪贴板快捷键仍然可用
  - 模型标签：Provider 标签与实际选中的模型保持一致
  - 欢迎页：分页历史下欢迎信息仍显示在顶部
  其他
  - 邀请码下载：官网二进制下载链接中的邀请码不再丢失
  - 语言切换：站点语言链接可用，首页品牌样式修正
  - 上下文预算说明：自动路由模型的上下文预算在 UI 中说明更清楚
  - 额度恢复：额度重置后先确认可用状态再自动恢复，暂停的循环会刷新等待中的控制器
  - team：成员工具目录在跨回合保持，写入受阻可见
  - code_review：后台审查交接有界，失败会明确上报
  - todo_sources / recap：任务进度基于记录的待办状态推导，不再与实际状态脱节

  🔧 重构（Refactoring）
  - WebUI SSE 复用：统一 SSE 解析与错误处理，接口错误不再被吞掉
  - MCP 生命周期：会话暂停/恢复纳入统一的重装配路径，停止与重连的边界更清晰
  - 热路径分配：去除工具定义、SGR 参数、栅格键与空白折叠中的临时分配，减少每帧与每回合开销
  - 压缩门禁拆分：压缩触发判定与请求行解耦，提示槽按会话分片，避免跨会话串扰

  📚 文档（Docs）
  - 新增 /quality、/browser、/fork、/setup 等命令与配置说明
  - 新增混合模型委派、跨账号边界、会话提示词保留与检查说明
  - 新增 DAP 调试、ATI 只读架构分析、项目能力配置、脏工作区提醒、显示历史分页等专题文档
  - 新增 Windows 中文路径编码与 Unicode 粘贴排障文档
  - config.example.toml 补齐质量门禁、DAP 适配器与推理预算示例

  🧹 工程 / 构建
  - 内嵌 WebUI 资源压缩分发，并新增包体积回归报告脚本
  - 新增基准测试脚本，用于报告模式下的性能对比
  - 发布脚本补充浏览器与调试相关资源打包，安装/卸载脚本同步更新
